<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chatbot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
  </head>
  <body>
    <nav class="navbar navbar-custom">
      <div class="container-compact">
        <a class="brand" href="/">AI Resume Screening</a>
        <div class="ms-auto"><a class="btn btn-sm btn-outline-light" href="/">Home</a></div>
      </div>
    </nav>
    <main class="container-compact py-5">
      <div class="row">
        <div class="col-lg-8 mx-auto">
          <div class="card-glass p-3">
            <h3 class="mb-3">Suggested Interview Questions</h3>
            <div>
              {% for q in questions %}
                <div class="question-card d-flex justify-content-between align-items-center">
                  <div>{{ q }}</div>
                  <div><button class="btn btn-sm btn-outline-light" onclick="navigator.clipboard.writeText('{{ q|escape }}')">Copy</button></div>
                </div>
              {% endfor %}
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
