<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Results</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
  </head>
  <body>
    <nav class="navbar navbar-custom">
      <div class="container-compact">
        <a class="brand" href="/">AI Resume Screening</a>
        <div class="ms-auto"><a class="btn btn-sm btn-outline-light" href="/">Home</a></div>
      </div>
    </nav>
    <main class="container-compact py-5">
      <div class="row">
        <div class="col-lg-8 mx-auto">
          <div class="card-glass p-3">
            <h3 class="mb-3">Scoring Results</h3>
            <div class="list-group">
              {% for r in results %}
                <div class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
                  <div>
                    <strong>{{ r.name }}</strong>
                    <div class="muted-small">Match score</div>
                  </div>
                  <div style="min-width:200px">
                    <div class="progress" style="height:14px">
                      <div class="progress-bar bg-info" role="progressbar" style="width: {{ r.score }}%;">{{ r.score }}%</div>
                    </div>
                  </div>
                </div>
              {% endfor %}
            </div>
            <div class="mt-3 text-end"><a class="btn btn-outline-light btn-sm" href="/">Back</a></div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
