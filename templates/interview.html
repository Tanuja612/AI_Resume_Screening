<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Interview</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
  </head>
  <body>
    <nav class="navbar navbar-custom">
      <div class="container-compact">
        <a class="brand" href="/">AI Resume Screening</a>
        <div class="ms-auto"><a class="btn btn-sm btn-outline-light" href="/">Home</a></div>
      </div>
    </nav>
    <main class="container-compact py-5">
      <div class="row">
        <div class="col-lg-8 mx-auto">
          <div class="card-glass p-3">
            <h3 class="mb-3">Interview Questions</h3>
            <form method="post">
              {% for q in questions %}
                <div class="mb-3">
                  <label class="form-label">{{ q }}</label>
                  <textarea name="answers" class="form-control" rows="2"></textarea>
                </div>
              {% endfor %}
              <button class="btn btn-primary">Submit Answers</button>
            </form>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
