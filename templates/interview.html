<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Interview</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="p-4">
  <h3>Interview Questions</h3>
  <form method="post">
    {% for q in questions %}
      <div class="mb-3">
        <label class="form-label">{{ q }}</label>
        <input name="answers" class="form-control">
      </div>
    {% endfor %}
    <button class="btn btn-primary">Submit Answers</button>
  </form>
</body>
</html>
