<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - AI Resume Screening</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    body {
      background: linear-gradient(135deg, #1a5c4f 0%, #0f3a2e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .form-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 15px;
      padding: 3rem 2.5rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      max-width: 420px;
      width: 100%;
    }

    .form-card h2 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.3rem;
      text-align: center;
    }

    .form-subtitle {
      text-align: center;
      color: #9aa4b2;
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-label {
      color: #eef2f7;
      font-size: 0.95rem;
      font-weight: 500;
      margin-bottom: 0.7rem;
    }

    .form-control {
      background: rgba(255, 255, 255, 0.08) !important;
      border: 1px solid rgba(255, 255, 255, 0.15) !important;
      color: #eef2f7 !important;
      border-radius: 8px;
      padding: 0.85rem 1rem;
      transition: all 0.3s ease;
    }

    .form-control:focus {
      background: rgba(255, 255, 255, 0.12) !important;
      border-color: #7c3aed !important;
      box-shadow: 0 0 0 0.2rem rgba(124, 58, 237, 0.25) !important;
      color: #eef2f7 !important;
    }

    .form-control::placeholder {
      color: #6b7a88 !important;
    }

    .btn-login {
      background: linear-gradient(90deg, #7c3aed, #06b6d4);
      border: 0;
      color: #fff;
      font-weight: 600;
      padding: 0.85rem 1.5rem;
      border-radius: 8px;
      width: 100%;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(124, 58, 237, 0.4);
      color: #fff;
    }

    .form-links {
      text-align: center;
      margin-top: 1.5rem;
    }

    .form-links a {
      color: #7c3aed;
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.3s ease;
    }

    .form-links a:hover {
      color: #06b6d4;
      text-decoration: underline;
    }

    .form-divider {
      text-align: center;
      margin: 0 0 0.5rem;
    }

    .alert {
      background: rgba(255, 0, 0, 0.12) !important;
      border: 1px solid rgba(255, 0, 0, 0.2) !important;
      color: #ff6b6b !important;
      border-radius: 8px;
      margin-bottom: 1.5rem;
    }
  </style>
</head>
<body>
  <div class="form-card">
    <h2>Welcome Back</h2>
    <p class="form-subtitle">Log in to access your resume screening dashboard</p>
    {% if error %}
      <div class="alert">{{ error }}</div>
    {% endif %}
    <form method="post">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input name="username" class="form-control" placeholder="Enter your username" required autofocus>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input name="password" type="password" class="form-control" placeholder="Enter your password" required>
      </div>
      <button type="submit" class="btn-login">Log In</button>
    </form>
    <div class="form-links form-divider">
      <p style="color: #6b7a88; margin: 1.5rem 0 0.5rem;">Don't have an account?</p>
      <a href="/signup">Create a new account</a>
    </div>
    <div class="form-links" style="margin-top: 1rem;">
      <a href="/">← Back to Home</a>
    </div>
  </div>
</body>
</html>
